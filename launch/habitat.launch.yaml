---
launch:
  - arg:
      name: habitat_config
      default: $(find-pkg-share habitat_ros)/config/habitat.yaml
  - arg:
      name: scene_file
      default: /developer/hm3d/val/00800-TEEsavR23oF/TEEsavR23oF.basis.glb
  - arg:
      name: python_env
      default: /developer/habitat_env/bin/python
  - node:
      pkg: habitat_ros
      exec: habitat_node.py
      name: habitat_node
      namespace: habitat
      on_exit: shutdown
      launch-prefix: $(var python_env)
      output: screen
      param:
        - name: config_path
          value: $(var habitat_config)
