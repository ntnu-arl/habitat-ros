---
launch:
  - arg:
      name: habitat_config
      default: $(find-pkg-share habitat_ros)/config/habitat.yaml
  - arg:
      name: navmesh_settings
      default: $(find-pkg-share habitat_ros)/config/navmesh.json
  - arg:
      name: scene_file
      default: /developer/ros2_hydra_ws/00800-TEEsavR23oF/TEEsavR23oF.glb
  - arg:
      name: path_topic_name
      default: /habitat/plan_path
  - arg:
      name: sim_goal_topic_name
      default: /habitat/sim_goal
  - arg:
      name: trigger_start_topic_name
      default: /habitat/ready
  - arg:
      name: python_env_habitat
      default: /developer/habitat_env/bin/python
  - set_remap: {from: /habitat/external_path, to: $(var path_topic_name)}
  - set_remap: {from: /habitat/trigger_start, to: $(var trigger_start_topic_name)}
  - set_remap: {from: /habitat/sim_goal, to: $(var sim_goal_topic_name)}
  - node:
      pkg: habitat_ros
      exec: habitat_node.py
      name: habitat_node
      namespace: habitat
      on_exit: shutdown
      launch-prefix: $(var python_env_habitat)
      output: screen
      param:
        - name: config_path
          value: $(var habitat_config)
        - name: navmesh_settings_path
          value: $(var navmesh_settings)
        - name: scene_file
          value: $(var scene_file)
